name: dockerproxy
version: main
slug: dockerproxy
description: Lightweight multi-host Docker registry cache/proxy
url: https://github.com/dthompso99/dockerproxy
arch:
  - amd64
startup: services
boot: auto
init: false
image: ghcr.io/dthompso99/dockerproxy
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: dockerproxy HTTP API and web UI
webui: "[PROTO:ssl]://[HOST]:[PORT:8080]/ui"
watchdog: http://[HOST]:[PORT:8080]/health
backup_exclude:
  - cache/*
options:
  hosts:
    - name: dockerhub
      url: https://registry-1.docker.io
  ttl: 31557600
  log_level: 1
  ssl: false
schema:
  hosts:
    - name: str
      url: url
      username: str?
      token: password?
  ttl: int
  log_level: int
  ssl: bool
